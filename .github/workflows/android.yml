name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 固定 debug 签名密钥：GitHub runner 每次都会新建 debug keystore，
      # 不缓存的话每次 APK 签名都不同，无法覆盖安装。这里把 keystore 缓存下来复用。
      # 注意：缓存过期（7 天未用）会导致签名再次变化，届时需卸载重装一次。
      - name: Cache debug keystore (stable signature)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: phone-monitor-debug-keystore-v1
          restore-keys: |
            phone-monitor-debug-keystore-

      - name: Show debug keystore fingerprint
        shell: bash
        run: |
          # 首次运行时 keystore 还不存在（Gradle 构建时才生成），这里只做提示
          if [ -f "$HOME/.android/debug.keystore" ]; then
            keytool -list -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey 2>/dev/null | grep -E "SHA256:|Alias name:" || true
          else
            echo "debug keystore 将在本次构建中生成，并缓存给后续构建使用"
          fi

      # 直接用 GitHub runner 预装的 Android SDK，避免 setup-android 动作的不稳定
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMGR="$(command -v sdkmanager)"
          else
            echo "sdkmanager not found, downloading command line tools"
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      # 仓库里没有 gradle-wrapper.jar，直接用 setup-gradle 安装 Gradle 8.7
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          gradle testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee ci-logs/unit-tests.log

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ci-logs/build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # 把 APK 发到公开 Release：无需登录 GitHub 即可直接下载
      - name: Publish APK to GitHub Release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          echo "APK=$APK"
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          VERSION=$(grep -m1 -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -m1 -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          NOTES="版本 v${VERSION} (build ${CODE})，CI 自动构建（${STAMP}，commit ${GITHUB_SHA:0:8}）。debug 签名，安装需允许未知来源。"
          echo "VERSION=$VERSION CODE=$CODE"
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest "$APK" --clobber
            gh release edit apk-latest \
              --title "PhoneMonitor v${VERSION} 测试包" \
              --notes "$NOTES"
          else
            gh release create apk-latest "$APK" \
              --title "PhoneMonitor v${VERSION} 测试包" \
              --notes "$NOTES"
          fi

      # 失败时把日志推到 ci-logs 分支（公开仓库可匿名拉取，便于排查）
      - name: Publish failure logs
        if: failure()
        shell: bash
        run: |
          set -e
          [ -d ci-logs ] || mkdir -p ci-logs
          echo "job failed at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > ci-logs/FAILED.txt
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f ci-logs
          git commit -m "ci: failure log $(date -u +%Y%m%dT%H%M%SZ)" || true
          git push --force origin ci-logs
