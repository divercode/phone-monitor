name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 直接用 GitHub runner 预装的 Android SDK，避免 setup-android 动作的不稳定
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMGR="$(command -v sdkmanager)"
          else
            echo "sdkmanager not found, downloading command line tools"
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      # 仓库里没有 gradle-wrapper.jar，直接用 setup-gradle 安装 Gradle 8.7
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          gradle testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee ci-logs/unit-tests.log

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ci-logs/build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # 失败时把日志推到 ci-logs 分支（公开仓库可匿名拉取，便于排查）
      - name: Publish failure logs
        if: failure()
        shell: bash
        run: |
          set -e
          [ -d ci-logs ] || mkdir -p ci-logs
          echo "job failed at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > ci-logs/FAILED.txt
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f ci-logs
          git commit -m "ci: failure log $(date -u +%Y%m%dT%H%M%SZ)" || true
          git push --force origin ci-logs
